{{- $type := .Values.persistence.type -}}
{{- if not (has $type (list "pvc" "inMemory")) }}
{{- fail (printf "persistence.type deve ser \"pvc\" ou \"inMemory\" (recebido: %q)" $type) }}
{{- end }}
{{- $pvc := eq $type "pvc" -}}
{{- /* pvc: StatefulSet com o SQLite no volume (dados mantidos); inMemory: Deployment sem volume (dados perdidos ao reiniciar).
       Sempre 1 réplica: banco SQLite e agendador rodam dentro do processo. */ -}}
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" $pvc }}
metadata:
  name: {{ include "cw.fullname" . }}
  labels: {{- include "cw.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if $pvc }}
  # Service comum (não headless): com 1 réplica o DNS por pod não é usado.
  serviceName: {{ include "cw.fullname" . }}
  # RollingUpdate num StatefulSet de 1 réplica apaga o pod antigo antes de criar o novo
  # (como o Recreate do Deployment), então o PVC RWO e o SQLite nunca têm dois donos.
  # Parallel: não trava o rollout esperando um pod quebrado ficar Ready (com OrderedReady,
  # voltar a versão após um pod em CrashLoop/ImagePull exigiria apagar o pod na mão).
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "cw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cw.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/seed: {{ dict "e" .Values.seed.environments "p" .Values.seed.projects "w" .Values.seed.webhooks | toJson | sha256sum }}
        checksum/secret: {{ dict "s" .Values.secrets.values "a" .Values.auth | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "cw.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: changelog-watcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.config.publicUrl | quote }}
            - name: REFRESH_INTERVAL_MINUTES
              value: {{ .Values.config.refreshIntervalMinutes | quote }}
            - name: REFRESH_ON_STARTUP
              value: {{ .Values.config.refreshOnStartup | quote }}
            - name: REPORT_CRON
              value: {{ .Values.config.reportCron | quote }}
            - name: REPORT_DAYS
              value: {{ .Values.config.reportDays | quote }}
            - name: REPORT_SEND_ENABLED
              value: {{ .Values.config.reportSendEnabled | quote }}
            - name: MAX_RELEASE_PAGES
              value: {{ .Values.config.maxReleasePages | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SEED_OVERWRITE
              value: {{ .Values.config.seedOverwrite | quote }}
            {{- if include "cw.hasSeed" . }}
            - name: CONFIG_FILE
              value: /config/config.yaml
            {{- end }}
            - name: DATABASE_URL
              value: {{ ternary "sqlite:////data/changelog-watcher.db" "sqlite:///:memory:" $pvc | quote }}
            {{- if and .Values.auth.enabled .Values.auth.existingSecret }}
            - name: AUTH_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: AUTH_USERNAME}}
            - name: AUTH_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: AUTH_PASSWORD}}
            {{- end }}
            {{- range $k, $v := .Values.config.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if or .Values.secrets.create .Values.secrets.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ include "cw.secretName" . }}
                optional: true
          {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $pvc }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if include "cw.hasSeed" . }}
            - name: seed
              mountPath: /config
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and $pvc .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- if include "cw.hasSeed" . }}
        - name: seed
          configMap:
            name: {{ include "cw.fullname" . }}-seed
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and $pvc (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "cw.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
