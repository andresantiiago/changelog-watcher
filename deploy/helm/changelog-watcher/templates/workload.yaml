{{- $type := .Values.persistence.type -}}
{{- if not (has $type (list "pvc" "inMemory")) }}
{{- fail (printf "persistence.type deve ser \"pvc\" ou \"inMemory\" (recebido: %q)" $type) }}
{{- end }}
{{- $pvc := eq $type "pvc" -}}
{{- /* pvc: StatefulSet with SQLite on the volume (data kept); inMemory: Deployment without a volume (data lost on restart).
       Always 1 replica: the SQLite database and the scheduler run inside the process. */ -}}
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" $pvc }}
metadata:
  name: {{ include "cw.fullname" . }}
  labels: {{- include "cw.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if $pvc }}
  # Regular (non-headless) Service: with 1 replica per-pod DNS is not used.
  serviceName: {{ include "cw.fullname" . }}
  # RollingUpdate on a 1-replica StatefulSet deletes the old pod before creating the new one
  # (like a Deployment's Recreate), so the RWO PVC and SQLite never have two owners.
  # Parallel: the rollout does not hang waiting for a broken pod to become Ready (with
  # OrderedReady, rolling back after a CrashLoop/ImagePull pod would require deleting it by hand).
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "cw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cw.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/seed: {{ dict "e" .Values.seed.environments "p" .Values.seed.projects "w" .Values.seed.webhooks | toJson | sha256sum }}
        checksum/secret: {{ dict "s" .Values.secrets.values "a" .Values.auth "m" .Values.metrics.token | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "cw.serviceAccountName" . }}
      automountServiceAccountToken: {{ or .Values.rbac.create .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: changelog-watcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_LANGUAGE
              value: {{ .Values.config.language | default "en" | quote }}
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.config.publicUrl | quote }}
            - name: REFRESH_INTERVAL_MINUTES
              value: {{ .Values.config.refreshIntervalMinutes | quote }}
            - name: REFRESH_ON_STARTUP
              value: {{ .Values.config.refreshOnStartup | quote }}
            - name: REPORT_CRON
              value: {{ .Values.config.reportCron | quote }}
            - name: REPORT_DAYS
              value: {{ .Values.config.reportDays | quote }}
            - name: REPORT_SEND_ENABLED
              value: {{ .Values.config.reportSendEnabled | quote }}
            - name: MAX_RELEASE_PAGES
              value: {{ .Values.config.maxReleasePages | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: EOL_ENABLED
              value: {{ .Values.config.eol.enabled | quote }}
            - name: EOL_API_URL
              value: {{ .Values.config.eol.apiUrl | quote }}
            - name: EOL_WARNING_DAYS
              value: {{ .Values.config.eol.warningDays | quote }}
            - name: EOL_AUTO_MATCH
              value: {{ .Values.config.eol.autoMatch | quote }}
            - name: TOLERANCE_DAYS
              value: {{ .Values.config.tolerance.days | quote }}
            - name: TOLERANCE_MINORS
              value: {{ .Values.config.tolerance.minors | quote }}
            - name: TOLERANCE_BUGFIXES
              value: {{ .Values.config.tolerance.bugfixes | quote }}
            - name: SEED_OVERWRITE
              value: {{ .Values.config.seedOverwrite | quote }}
            {{- if include "cw.hasSeed" . }}
            - name: CONFIG_FILE
              value: /config/config.yaml
            {{- end }}
            - name: DATABASE_URL
              value: {{ ternary "sqlite:////data/changelog-watcher.db" "sqlite:///:memory:" $pvc | quote }}
            {{- if not (or .Values.auth.enabled (dig "oidc" "enabled" false .Values.auth)) }}
            - name: AUTH_DISABLED
              value: "true"
            {{- end }}
            {{- with .Values.auth.oidc }}
            {{- if .enabled }}
            {{- if not $.Values.config.publicUrl }}{{ fail "auth.oidc needs config.publicUrl (redirect URI)" }}{{ end }}
            {{- if not (or .editorGroups .viewerGroups) }}{{ fail "auth.oidc needs editorGroups and/or viewerGroups" }}{{ end }}
            - name: OIDC_ISSUER_URL
              value: {{ required "auth.oidc.issuerUrl is required" .issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .clientId | default "changelog-watcher" | quote }}
            - name: OIDC_SCOPES
              value: {{ .scopes | default "openid email profile groups" | quote }}
            - name: OIDC_EDITOR_GROUPS
              value: {{ join "," .editorGroups | quote }}
            - name: OIDC_VIEWER_GROUPS
              value: {{ join "," .viewerGroups | quote }}
            - name: SESSION_MAX_AGE_HOURS
              value: {{ .sessionMaxAgeHours | default 12 | quote }}
            {{- with .existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ . }}, key: OIDC_CLIENT_SECRET}}
            - name: SESSION_SECRET
              valueFrom: {secretKeyRef: {name: {{ . }}, key: SESSION_SECRET}}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and .Values.auth.enabled .Values.auth.existingSecret }}
            - name: AUTH_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: AUTH_USERNAME}}
            - name: AUTH_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: AUTH_PASSWORD}}
            {{- end }}
            {{- range $k, $v := .Values.config.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if or .Values.secrets.create .Values.secrets.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ include "cw.secretName" . }}
                optional: true
          {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $pvc }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if include "cw.hasSeed" . }}
            - name: seed
              mountPath: /config
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and $pvc .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- if include "cw.hasSeed" . }}
        - name: seed
          configMap:
            name: {{ include "cw.fullname" . }}-seed
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and $pvc (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "cw.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
