{{- define "cw.networkPolicyDNS" -}}
# DNS (kube-dns, NodeLocal DNSCache etc.): without it no name resolves.
- ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
{{- end -}}

{{- with .Values.networkPolicy.prometheus }}
{{- if .enabled }}
{{- $peer := dict "namespaceSelector" .namespaceSelector "podSelector" .podSelector }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cw.fullname" $ }}-prometheus
  labels: {{- include "cw.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cw.selectorLabels" $ | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # /metrics scrape by Prometheus.
    - from: [{{ toJson $peer }}]
      ports: [{port: http}]
    {{- with .allowIngressFrom }}
    # Other allowed sources (ingress controller etc.).
    - from: {{- toYaml . | nindent 8 }}
      ports: [{port: http}]
    {{- end }}
  egress:
    # Prometheus/Thanos API queries.
    - to: [{{ toJson $peer }}]
      {{- with .ports }}
      ports:
        {{- range . }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
      {{- end }}
    {{- include "cw.networkPolicyDNS" $ | nindent 4 }}
---
{{- end }}
{{- end }}

{{- with .Values.networkPolicy.internet }}
{{- if .enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cw.fullname" $ }}-internet
  labels: {{- include "cw.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cw.selectorLabels" $ | nindent 6 }}
  policyTypes: [Egress]
  egress:
    # Release sources (GitHub, GitLab, Docker Hub, web pages) and webhooks.
    # ponytail: IPv4 only; on a dual-stack cluster, add an ipBlock ::/0 here.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .except }}
            except: {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- include "cw.networkPolicyDNS" $ | nindent 4 }}
{{- end }}
{{- end }}
