{{- with .Values.auth.oidc }}
{{- if and .enabled (not .existingSecret) (or (not $.Values.secrets.create) $.Values.secrets.existingSecret) }}
{{- fail "auth.oidc without auth.oidc.existingSecret stores OIDC_CLIENT_SECRET/SESSION_SECRET in the chart Secret, which secrets.create=false / secrets.existingSecret turn off: set auth.oidc.existingSecret" }}
{{- end }}
{{- end }}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cw.secretName" . }}
  labels: {{- include "cw.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- $prev := lookup "v1" "Secret" .Release.Namespace (include "cw.secretName" .) }}
  {{- with .Values.auth.oidc }}
  {{- if and .enabled (not .existingSecret) }}
  OIDC_CLIENT_SECRET: {{ required "auth.oidc.clientSecret or auth.oidc.existingSecret is required" .clientSecret | quote }}
  SESSION_SECRET: {{ dig "data" "SESSION_SECRET" "" $prev | b64dec | default (randAlphaNum 48) | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
  {{- /* no auth.password: keeps the password already generated in the Secret (lookup) or generates a new one */}}
  AUTH_USERNAME: {{ .Values.auth.username | quote }}
  AUTH_PASSWORD: {{ .Values.auth.password | default (dig "data" "AUTH_PASSWORD" "" $prev | b64dec) | default (randAlphaNum 24) | quote }}
  {{- end }}
  {{- with .Values.metrics.token }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
