# Valores para rodar no cluster kind local com a imagem construída localmente.
#   docker build -t changelog-watcher:local .
#   kind load docker-image changelog-watcher:local --name lab
#   helm upgrade --install changelog-watcher deploy/helm/changelog-watcher -n changelog-watcher --create-namespace -f deploy/helm/values-kind.yaml
image:
  repository: changelog-watcher
  tag: local
  pullPolicy: Never          # a imagem foi carregada no nó com `kind load`

config:
  publicUrl: http://localhost:8080
  refreshOnStartup: true

# Prometheus do kube-prometheus-stack do próprio cluster (acesso interno, sem auth).
seed:
  environments:
    - name: kind-lab
      description: Cluster kind local
      prometheus_url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  projects:
    - name: grafana
      source_type: github_releases
      repository: grafana/grafana
      detection_mode: image
      image_pattern: docker.io/grafana/grafana
      workload_namespace: monitoring
      deployments: {kind-lab: {}}
    - name: prometheus
      source_type: github_releases
      repository: prometheus/prometheus
      detection_mode: image
      image_pattern: quay.io/prometheus/prometheus
      workload_namespace: monitoring
      deployments: {kind-lab: {}}
    - name: prometheus-operator
      source_type: github_releases
      repository: prometheus-operator/prometheus-operator
      detection_mode: image
      image_pattern: quay.io/prometheus-operator/prometheus-operator
      workload_namespace: monitoring
      deployments: {kind-lab: {}}
    - name: kube-state-metrics
      source_type: github_releases
      repository: kubernetes/kube-state-metrics
      detection_mode: image
      image_pattern: registry.k8s.io/kube-state-metrics/kube-state-metrics
      workload_namespace: monitoring
      deployments: {kind-lab: {}}
