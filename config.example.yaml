# changelog-watcher initial configuration (seed).
# Loaded on startup when CONFIG_FILE points to this file.
# By default it only creates what does not exist (the UI then owns the data);
# with SEED_OVERWRITE=true the file overwrites the fields it declares.
#
# Values like ${VARIABLE} are read from the environment at use time,
# so tokens and webhook URLs can come from a Kubernetes Secret.

environments:
  - name: desenvolvimento
    description: Cluster de desenvolvimento
    prometheus_url: http://prometheus-dev.monitoring:9090

  - name: producao
    description: Cluster de produção (Thanos com vários clusters)
    prometheus_url: https://thanos.empresa.com
    prometheus_auth: bearer               # none | bearer | basic
    prometheus_token: ${PROM_PROD_TOKEN}
    prometheus_extra_selector: cluster="prod"   # added to every query
    prometheus_verify_tls: true

projects:
  # GitHub releases; version in use = every workload of the "argocd" Helm release.
  - name: argo-cd
    tags: [plataforma]
    source_type: github_releases          # ... | changelog | webpage (URL of a page listing the versions)
    repository: argoproj/argo-cd
    detection_mode: helm                  # none | workload | helm | image | query
    workload_namespace: argocd
    workload_name: argocd                 # release name (in workload mode, the Deployment's)
    image_pattern: quay.io/argoproj/argocd  # ignores redis/dex of the same release
    deployments:
      desenvolvimento: {}                 # version via Prometheus
      producao: {}

  # Detection by image: any pod running ghcr.io/.../cert-manager-controller
  - name: cert-manager
    source_type: github_releases
    repository: cert-manager/cert-manager
    detection_mode: image
    image_pattern: quay.io/jetstack/cert-manager-controller
    deployments:
      desenvolvimento: {}
      producao: {}

  # Monorepo: filters the chart tags with tag_pattern
  - name: kube-prometheus-stack
    source_type: helm_index
    repository: https://prometheus-community.github.io/helm-charts
    chart_name: kube-prometheus-stack
    deployments:
      producao: {version_source: manual, manual_version: "65.1.0"}

  # Docker Hub image; PostgreSQL uses "major.bugfix" (16.2 -> 16.9 is a bugfix)
  - name: postgres
    source_type: dockerhub
    repository: library/postgres
    version_scheme: major_patch
    eol_product: postgresql               # endoflife.date (empty = look up by name; none = disabled)
    detection_mode: workload
    workload_kind: statefulset
    workload_namespace: database
    workload_name: postgres
    deployments:
      producao: {}
      desenvolvimento: {namespace_override: database-dev}

  # Project without releases, only a CHANGELOG.md
  - name: minha-api
    source_type: changelog
    repository: https://github.com/minha-org/minha-api/blob/main/CHANGELOG.md
    deployments:
      producao: "2.3.1"                   # shortcut for a manual version

  # Self-hosted GitLab with tags; notes completed from the CHANGELOG
  - name: servico-interno
    source_type: gitlab_tags
    repository: plataforma/servico-interno
    source_url: https://gitlab.empresa.com
    changelog_url: https://gitlab.empresa.com/plataforma/servico-interno/-/raw/main/CHANGELOG.md
    detection_mode: query
    promql_query: kube_pod_container_info{namespace="{namespace}", container="app", pod=~"servico-interno-.*"}
    workload_namespace: servicos
    deployments:
      producao: {}

webhooks:
  - name: slack-plataforma
    kind: slack                           # generic | slack | teams | discord | google_chat
    url: ${SLACK_WEBHOOK_URL}
  - name: teams-producao
    kind: teams
    url: ${TEAMS_WEBHOOK_URL}
    environments: [producao]              # only these environments
    only_outdated: true                   # does not send when everything is up to date
