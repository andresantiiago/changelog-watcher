<!doctype html>
<html lang="pt-BR">
<head>

  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">

      Changelog Watcher

    <nav class="nav" id="nav">
      <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg>Dashboard</a>
      <a href="#/apps" data-route="apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5zM3.3 7L12 12l8.7-5M12 22V12"/></svg>Aplicações</a>

      <a href="#/releases" data-route="releases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4L13.4 20.6a2 2 0 01-2.8 0L2 12V2h10l8.6 8.6a2 2 0 010 2.8zM7 7h.01"/></svg>Novas versões</a>
      <a href="#/reports" data-route="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>Relatórios</a>

    <div class="foot">

    <header class="topbar">

      <h1 id="page-title">Dashboard</h1>
      <div class="spacer"></div>
      <div class="refresh-info" id="refresh-info"></div>
      <button class="btn primary" id="refresh-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/></svg>
        <span>Buscar atualizações</span>
      </button>
    </header>
    <main class="content" id="view"></main>

<div class="toast-host" id="toasts"></div>
<script src="/static/app.js"></script>
