[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changelog-watcher"
version = "1.1.0"
description = "Watches application changelogs/releases, compares them with the versions deployed in each environment and builds reports, metrics and alerts."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "apscheduler>=3.10,<4",
    "pyyaml>=6",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "pytest-cov>=6", "ruff>=0.15"]

[project.scripts]
changelog-watcher = "changelog_watcher.cli:main"

[tool.setuptools.packages.find]
include = ["changelog_watcher*"]

[tool.setuptools.package-data]
changelog_watcher = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["changelog_watcher"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
# pyflakes + erros graves do pycodestyle, imports ordenados, sintaxe moderna e bugbear.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100"]
ignore = ["B008"]  # Depends()/Query() em default de argumento é o padrão do FastAPI
